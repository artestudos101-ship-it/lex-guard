[project]
name = "lex-guard-back"
version = "0.1.0"
description = "Evidence-first contract analysis backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.15,<2.0",
  "redis>=5.2,<6.0",
  "python-multipart>=0.0.20,<1.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "python-jose[cryptography]>=3.3,<4.0",
]
[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.25", "httpx>=0.28"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
